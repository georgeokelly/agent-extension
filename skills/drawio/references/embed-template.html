<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PASTE_TITLE_HERE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
    }
    #diagram-container {
      min-width: 200px; max-height: 80vh;
      overflow: auto; cursor: grab;
      display: none;
    }
    #diagram-container.dragging { cursor: grabbing; user-select: none; }
    #diagram-container .mxgraph { width: 100%; max-width: 100%; }
    #loading {
      display: flex; align-items: center; justify-content: center;
      padding: 24px; font-size: 14px; color: #888;
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid #e0e0e0; border-top-color: #333;
      border-radius: 50%; animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #fallback {
      display: none; padding: 16px; margin: 12px 0;
      border: 1px solid #ccc; border-radius: 6px;
      font-size: 13px; text-align: center;
    }
    #fallback a { color: #1a73e8; text-decoration: underline; }
  </style>
</head>
<body>
  <div id="loading"><div class="spinner"></div>Loading diagram…</div>
  <div id="fallback"></div>
  <div id="diagram-container"></div>

  <!-- Agent: paste the generated draw.io XML here verbatim. No escaping needed. -->
  <script type="text/xml" id="diagram-data">PASTE_DIAGRAM_XML_HERE</script>

  <script>
    (function() {
      var VIEWER_URL = 'https://viewer.diagrams.net/js/viewer-static.min.js';
      var TIMEOUT_MS = 8000;
      var diagramXml = document.getElementById('diagram-data').textContent;

      var script = document.createElement('script');
      script.src = VIEWER_URL;
      script.async = true;

      var timer = setTimeout(function() {
        showFallback('Diagram viewer could not be loaded. '
          + 'You can <a href="https://app.diagrams.net/" target="_blank" '
          + 'rel="noopener noreferrer">open draw.io</a> and paste the XML, '
          + 'or open the .drawio file directly.');
      }, TIMEOUT_MS);

      script.onload = function() {
        clearTimeout(timer);
        renderDiagram();
      };

      script.onerror = function() {
        clearTimeout(timer);
        showFallback('Failed to load the draw.io viewer script. '
          + 'Check your network connection or CSP policy.');
      };

      document.head.appendChild(script);

      function showFallback(html) {
        document.getElementById('loading').style.display = 'none';
        var el = document.getElementById('fallback');
        el.innerHTML = html;
        el.style.display = 'block';
      }

      function renderDiagram() {
        var isMultiPage = /<diagram[\s>]/i.test(diagramXml)
          && (diagramXml.match(/<diagram[\s>]/gi) || []).length > 1;

        var config = {
          highlight: '#0000ff',
          'dark-mode': 'auto',
          nav: true,
          center: true,
          border: 8,
          editable: false,
          toolbar: isMultiPage
            ? 'pages zoom layers lightbox'
            : 'zoom layers lightbox',
          xml: diagramXml
        };

        var container = document.getElementById('diagram-container');
        var div = document.createElement('div');
        div.className = 'mxgraph';
        div.setAttribute('data-mxgraph', JSON.stringify(config));
        container.appendChild(div);

        document.getElementById('loading').style.display = 'none';
        container.style.display = 'block';

        GraphViewer.darkBackgroundColor =
          getComputedStyle(document.body).backgroundColor;
        GraphViewer.processElements();

        var startX, startY, scrollL, scrollT, dragging = false;
        container.addEventListener('mousedown', function(e) {
          dragging = true;
          startX = e.clientX; startY = e.clientY;
          scrollL = container.scrollLeft; scrollT = container.scrollTop;
          container.classList.add('dragging');
        });
        document.addEventListener('mousemove', function(e) {
          if (!dragging) return;
          container.scrollLeft = scrollL - (e.clientX - startX);
          container.scrollTop = scrollT - (e.clientY - startY);
        });
        document.addEventListener('mouseup', function() {
          if (dragging) { dragging = false; container.classList.remove('dragging'); }
        });
      }
    })();
  </script>
</body>
</html>
